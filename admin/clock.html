<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock</title>
  <style>
   body {
  margin: 0;
  background: #7f6bf8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.container {
  text-align: center;
}

.clock {
  width: 64px;
  height: 64px;
  border: 2px solid white;
  border-radius: 50%;
  position: relative;
  margin: auto;
  background: white;
}

.hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform-origin: bottom center;
  transform: translateX(-50%) rotate(0deg);
  border-radius: 1px;
}

.hour {
  width: 2px;
  height: 16px;
  background-color: orange;
}

.minute {
  width: 1.5px;
  height: 22px;
  background-color: orangered;
}

.second {
  width: 1px;
  height: 26px;
  background-color: black;
}

.center-dot {
  width: 4px;
  height: 4px;
  background: black;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.digital-time {
  color: white;
  font-size: 10px;
  margin-top: 5px;
  font-weight: bold;
}

.number {
  position: absolute;
  top: 45%;
  left: 48%;
  transform: rotate(calc(var(--n) * 30deg)) translateY(-28px);
  transform-origin: center;
  font-size: 6px;
  font-weight: bold;
  color: black;
}

  </style>
</head>
<body>
  <div class="container">
    <div class="clock">
      <div class="number" style="--n:1">1</div>
      <div class="number" style="--n:2">2</div>
      <div class="number" style="--n:3">3</div>
      <div class="number" style="--n:4">4</div>
      <div class="number" style="--n:5">5</div>
      <div class="number" style="--n:6">6</div>
      <div class="number" style="--n:7">7</div>
      <div class="number" style="--n:8">8</div>
      <div class="number" style="--n:9">9</div>
      <div class="number" style="--n:10">10</div>
      <div class="number" style="--n:11">11</div>
      <div class="number" style="--n:12">12</div>

      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center-dot"></div>
    </div>
    <div class="digital-time" id="digitalTime"></div>
  </div>

  <script>
function updateClock() {
  const now = new Date();
  const hour = now.getHours();
  const minutes = now.getMinutes();
  const seconds = now.getSeconds();

  const hourDeg = ((hour % 12) + minutes / 60) * 30;
  const minuteDeg = (minutes + seconds / 60) * 6;
  const secondDeg = seconds * 6;

  document.getElementById('hour').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
  document.getElementById('minute').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
  document.getElementById('second').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;

  const ampm = hour >= 12 ? 'PM' : 'AM';
  const displayHour = hour % 12 === 0 ? 12 : hour % 12;
  const digitalTime = `${displayHour.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')} ${ampm}`;
  document.getElementById('digitalTime').textContent = digitalTime;
}

setInterval(updateClock, 1000);
updateClock(); // initial render

  </script>
</body>
</html>
